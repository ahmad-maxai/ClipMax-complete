AutoName: ClipMax

Summary: Offline clipboard manager and system keyboard

Description: |-
  ClipMax helps you save and organize copied text on your Android device.

  Use ClipMax to keep useful text snippets accessible through its clipboard
  interface and keyboard. Find saved clips and reuse text when you need it.

  Features:
  * Save and organize text snippets
  * Search saved clips
  * Access clips through the ClipMax keyboard
  * Insert long text using bounded surrogate-safe chunks
  * Keep your clipboard collection private and offline on your device

