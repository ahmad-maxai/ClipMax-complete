AutoName: ClipMax

Summary: Offline clipboard manager & bilingual English/Arabic keyboard

Description: |-
  ClipMax helps you save, protect, and organize copied text on your Android
  device, and insert snippets directly through its bilingual native keyboard.

  Features:
  * Bilingual native keyboard (English QWERTY and Arabic العربية layouts)
  * Full English (LTR) and Arabic (العربية, RTL) interface localization
  * Offline English word suggestions and autocorrection (AOSP Apache-2.0 list)
  * Auto-activating numeric keypad, symbols, and emoji picker
  * Save, search, pin, split, merge, and lock clips against auto-expiry
  * Insert long text safely using bounded 50,000 UTF-16 chunks with Undo/Redo
  * Keep your clipboard collection strictly private and offline (no INTERNET perm)
